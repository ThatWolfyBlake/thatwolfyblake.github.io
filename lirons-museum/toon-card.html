<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Toon Profile — Liron's Museum</title>

<style>
:root {
  --bg: #160A05;
  --chocolate: #241006;
  --panel: #2B1408;
  --orange: #FF9B32;
  --gold: #FFB65B;
  --cream: #FFE5C5;
  --beige: #D9BDA5;
  --muted: #987B68;
  --border: #FF8C42;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  font-family: system-ui, "Segoe UI", sans-serif;

  background:
    radial-gradient(ellipse at 50% 0%, #54270f 0%, transparent 48%),
    radial-gradient(ellipse at 100% 45%, #351509 0%, transparent 40%),
    linear-gradient(145deg, var(--chocolate), var(--bg) 65%);
}

.page {
  width: min(100% - 32px, 760px);
  margin: auto;
  padding: 30px 0 55px;
}

/* HEADER */

header {
  text-align: center;
  margin-bottom: 30px;
}

.brand {
  display: inline-block;
  color: var(--orange);
  font-size: clamp(2rem, 7vw, 3.3rem);
  font-weight: 850;
  letter-spacing: -.045em;
  text-decoration: none;
  text-shadow: 0 0 22px #ff8c4238;
}

.brand:hover {
  color: var(--gold);
}

.subtitle {
  color: var(--beige);
  margin-top: 8px;
}

/* PROFILE */

.profile {
  animation: appear .4s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.image-section {
  width: 100%;
  max-width: 430px;
  margin: 0 auto 25px;
}

.main-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 15px;
  overflow: hidden;
  border: 2px solid var(--border);

  background:
    radial-gradient(circle, #6c3518, #2b1408 75%);

  box-shadow: 0 0 25px #ff8c4225;
  display: grid;
  place-items: center;
  position: relative;
}

.main-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.image-placeholder {
  color: var(--gold);
  font-size: 5rem;
  font-weight: 850;
  text-shadow: 0 0 25px #ff9b3255;
}

.image-buttons {
  display: flex;
  gap: 10px;
  margin-top: 13px;
}

.image-buttons button {
  flex: 1;
  padding: 11px 8px;
  border-radius: 10px;

  border: 1px solid #70401f;
  background: #2b1408;

  color: var(--beige);
  font: 750 .9rem system-ui;
  cursor: pointer;
  transition: .2s;
}

.image-buttons button:hover {
  border-color: var(--orange);
  color: var(--cream);
}

.image-buttons button.active {
  background: linear-gradient(135deg, var(--orange), var(--gold));
  border-color: var(--gold);
  color: #281006;
  box-shadow: 0 0 15px #ff9b3233;
}

.image-label {
  color: var(--muted);
  font-size: .8rem;
  text-align: center;
  margin-top: 9px;
}

/* INFORMATION */

.info-panel {
  padding: 22px;
  border: 1px solid #87431f;
  border-radius: 15px;

  background:
    linear-gradient(160deg, #3b1d0d99, #241006d9);

  box-shadow: 0 8px 24px #00000020;
}

.toon-name {
  margin: 0;
  color: var(--orange);
  font-size: clamp(2rem, 7vw, 2.7rem);
  font-weight: 850;
  letter-spacing: -.035em;
  text-shadow: 0 0 15px #ff9b3224;
}

.toon-surname {
  color: var(--gold);
}

.rarity {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 13px;

  border-radius: 20px;
  border: 1px solid var(--border);

  background: #ff9b3215;
  color: var(--gold);

  font-size: .85rem;
  font-weight: 800;
}

.divider {
  height: 1px;
  margin: 23px 0;
  background: linear-gradient(
    90deg,
    #9b542a,
    #482312 75%,
    transparent
  );
}

.section-title {
  color: var(--orange);
  font-size: 1.15rem;
  font-weight: 850;
  margin: 0 0 10px;
}

.description {
  color: var(--beige);
  line-height: 1.7;
  white-space: pre-line;
  margin: 0;
}

.trinket {
  color: var(--cream);
  font-size: 1.05rem;
  font-weight: 750;
}

/* PUFFIN EXCLUSIVE */

.special-card {
  margin-top: 23px;
  padding: 16px;

  border: 1px solid var(--border);
  border-radius: 15px;

  background: linear-gradient(145deg, #49200d, #241006);

  box-shadow: 0 0 22px #ff9b3215;
}

.special-card h2 {
  color: var(--gold);
  font-size: 1.1rem;
  margin: 0 0 13px;
}

.special-card img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 10px;
  border: 1px solid #ff8c4266;
}

/* BLUY EXCLUSIVE */

.toon-page-link {
  display: block;
  margin-top: 23px;
  padding: 14px;

  text-align: center;
  text-decoration: none;

  border-radius: 12px;
  border: 1px solid var(--border);

  background: linear-gradient(135deg, var(--orange), var(--gold));
  color: #281006;

  font-weight: 850;
  transition: .2s;
}

.toon-page-link:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 20px #ff9b3244;
}

/* NOT FOUND */

.not-found {
  text-align: center;
  padding: 55px 20px;

  border: 1px dashed #87502d;
  border-radius: 15px;
  background: #2b140866;
}

.not-found h1 {
  color: var(--orange);
}

/* FOOTER */

footer {
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
  margin-top: 40px;
}

/* MOBILE */

@media(max-width:520px) {
  .page {
    width: min(100% - 22px, 760px);
    padding-top: 22px;
  }

  .info-panel {
    padding: 17px;
  }

  .image-section {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div class="page">

<header>
  <a class="brand" href="/lirons-museum/">
    Liron's Museum
  </a>

  <p class="subtitle">
    Discover the museum's extraordinary toons.
  </p>
</header>

<main id="profileContainer"></main>

<footer>
  © Liron's Museum · Every toon has a story.
</footer>

</div>

<script>

/* =====================================
   TOON DATABASE
===================================== */

const categories = {

  Primary: [
    "Liron FireBloom"
  ],

  Leads: [
    "Don",
    "Countess Lockie",
    "Nixxy",
    "K",
    "M",
    "J"
  ],

  Mains: [
    "Bluy",
    "Hazel",
    "Solaris",
    "N3x0r",
    "Rose",
    "Shiro"
  ],

  Rares: [
    "Jesse",
    "Vexel",
    "Chris",
    "Dylan",
    "Lunaris",
    "Mike",
    "Maris",
    "Sarah",
    "Milly",
    "Creamy",
    "Randy",
    "Leon",
    "Balley",
    "Ashy"
  ],

  Uncommons: [
    "Lily",
    "Willy",
    "Lurian",
    "Matt",
    "Sleeper",
    "Garret",
    "Luki",
    "Violet-Lizzy",
    "Cardog",
    "Marshy"
  ],

  Commons: [
    "Puffin",
    "Spike",
    "Straps",
    "Gummy"
  ],

  EX: []

};

/* =====================================
   CUSTOM TOON INFORMATION
===================================== */

const toonData = {

  "Bluy": {
    surname: "",
    description: "Description coming soon.",
    trinket: "Not added yet."
  },

  "Puffin": {
    surname: "",
    description: "Description coming soon.",
    trinket: "Not added yet."
  }

};

/* =====================================
   GET TOON FROM URL
===================================== */

const params = new URLSearchParams(window.location.search);
const toonName = params.get("");

const container = document.getElementById("profileContainer");

/* =====================================
   HELPERS
===================================== */

function slugify(name) {
  return name.toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function getRarity(name) {

  for (const [rarity, toons] of Object.entries(categories)) {

    if (toons.includes(name)) {
      return rarity;
    }

  }

  return "Unknown";
}

/* =====================================
   IMAGE SYSTEM
===================================== */

let currentImage = "regular";

function changeImage(type) {

  currentImage = type;

  const slug = slugify(toonName);

  const image = document.getElementById("toonImage");
  const placeholder = document.getElementById("imagePlaceholder");

  const regularButton = document.getElementById("regularButton");
  const drawingButton = document.getElementById("drawingButton");
  const label = document.getElementById("imageLabel");

  /*
    REGULAR:
    assets/bluy.png

    DRAWING:
    assets/drawings/d_bluy.png
  */

  const path = type === "drawing"
    ? `/lirons-museum/assets/drawings/d_${slug}.png`
    : `/lirons-museum/assets/${slug}.png`;

  regularButton.classList.toggle("active", type === "regular");
  drawingButton.classList.toggle("active", type === "drawing");

  label.textContent = type === "drawing"
    ? "Individual Design"
    : "Regular Toon Card";

  image.style.display = "block";
  placeholder.style.display = "none";

  image.onerror = function() {
    image.style.display = "none";
    placeholder.style.display = "block";
  };

  image.src = path;
}

/* =====================================
   PROFILE RENDERING
===================================== */

function renderProfile() {

  if (!toonName) {
    showNotFound("No toon was specified.");
    return;
  }

  const allToons = Object.values(categories).flat();

  if (!allToons.includes(toonName)) {
    showNotFound("This toon does not exist in the museum's collection.");
    return;
  }

  const slug = slugify(toonName);
  const data = toonData[toonName] || {};

  const surname = data.surname || "";
  const rarity = getRarity(toonName);

  const description = data.description || "Description coming soon.";
  const trinket = data.trinket || "Not added yet.";

  const fullName = surname
    ? `${toonName} ${surname}`
    : toonName;

  const isPuffin = toonName === "Puffin";
  const isBluy = toonName === "Bluy";

  container.innerHTML = `

    <div class="profile">

      <section class="image-section">

        <div class="main-image">

          <img
            id="toonImage"
            src="/lirons-museum/assets/${slug}.png"
            alt="${fullName}"
          >

          <div
            class="image-placeholder"
            id="imagePlaceholder"
            style="display:none"
          >
            ?
          </div>

        </div>

        <div class="image-buttons">

          <button
            id="regularButton"
            class="active"
            onclick="changeImage('regular')"
          >
            Regular Image
          </button>

          <button
            id="drawingButton"
            onclick="changeImage('drawing')"
          >
            Drawing
          </button>

        </div>

        <div class="image-label" id="imageLabel">
          Regular Toon Card
        </div>

      </section>

      <section class="info-panel">

        <h1 class="toon-name">
          ${toonName}
          <span class="toon-surname">${surname}</span>
        </h1>

        <span class="rarity">
          ${rarity}
        </span>

        <div class="divider"></div>

        <h2 class="section-title">
          Description
        </h2>

        <p class="description">${description}</p>

        <div class="divider"></div>

        <h2 class="section-title">
          Trinket
        </h2>

        <p class="trinket">
          ${trinket}
        </p>

      </section>

      ${isPuffin ? `

        <section class="special-card">

          <h2>
            Introduction Card
          </h2>

          <img
            src="/lirons-museum/assets/puffin-card.png"
            alt="Puffin's Introduction Card"
            onerror="this.style.display='none'"
          >

        </section>

      ` : ""}

      ${isBluy ? `

        <a
          class="toon-page-link"
          href="/lirons-museum/bluy.html"
        >
          Visit Bluy's Toon Page →
        </a>

      ` : ""}

    </div>

  `;

}

/* =====================================
   NOT FOUND
===================================== */

function showNotFound(message) {

  container.innerHTML = `

    <section class="not-found">

      <h1>Toon Not Found</h1>

      <p>${message}</p>

      <a
        class="toon-page-link"
        href="/lirons-museum/see-toons.html"
      >
        Return to See Toons
      </a>

    </section>

  `;

}

/* =====================================
   START
===================================== */

renderProfile();

</script>

</body>
</html>
