<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7b</title>

<style>
@font-face {
  font-family: "DeterminationSans";
  src: url("../fontes/determinationsansweb-webfont.ttf");
}

body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:"DeterminationSans", sans-serif;
}

canvas{
  position:fixed;
  top:0;
  left:0;
}

/* texto fixo */
#textLayer{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  display:flex;
  gap:10px;
}

.letter{
  width:32px;
  text-align:center;
  font-size:32px;
  color:rgba(200,230,255,0.9);
}
</style>

</head>

<body>

<canvas id="bubbles"></canvas>
<div id="textLayer"></div>

<script>

const canvas = document.getElementById("bubbles");
const ctx = canvas.getContext("2d");
const textLayer = document.getElementById("textLayer");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();

/* 🧠 letras */
const letters = "TIMERUNE".split("");
const slots = Array(letters.length).fill(null);

/* 🧠 posições FIXAS no centro */
const letterPositions = [];

function updatePositions(){
  const startX = canvas.width / 2 - (letters.length * 20);
  const y = canvas.height * 0.55;

  for(let i = 0; i < letters.length; i++){
    letterPositions[i] = {
      x: startX + i * 40,
      y: y
    };
  }
}

updatePositions();

/* render texto */
function renderLetters(){
  textLayer.innerHTML = "";
  for(let i = 0; i < letters.length; i++){
    const span = document.createElement("div");
    span.className = "letter";
    span.innerText = slots[i] || "";
    textLayer.appendChild(span);
  }
}

let nextLetter = 0;

function placeLetter(){
  if(nextLetter >= letters.length) return;
  slots[nextLetter] = letters[nextLetter];
  nextLetter++;
  renderLetters();
}

/* 🫧 bolhas */
const bubbles = [];

for(let i = 0; i < 70; i++){
  bubbles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,

    r: Math.random() < 0.35 ? Math.random() * 14 + 6 : Math.random() * 4 + 1,

    speed: Math.random() * 0.25 + 0.08,
    drift: (Math.random() - 0.5) * 0.6,
    phase: Math.random() * 1000,

    alpha: Math.random() * 0.25 + 0.05,

    big: Math.random() < 0.35,

    targetIndex: -1,
    state: "normal",
    timer: 0
  });
}

let time = 0;

function animate(){
  requestAnimationFrame(animate);
  time += 0.01;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let b of bubbles){

    let sway = Math.sin(time + b.phase) * 0.4;

    b.x += b.drift + sway;
    b.y -= b.speed;

    /* 🫧 bolha */
    if(b.big){
      ctx.strokeStyle = `rgba(120,190,255,${b.alpha + 0.15})`;
      ctx.shadowBlur = 6;
      ctx.shadowColor = "rgba(120,190,255,0.6)";
    } else {
      ctx.strokeStyle = `rgba(200,230,255,${b.alpha})`;
      ctx.shadowBlur = 0;
    }

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.stroke();

    /* 🎯 captura EXATA de posição */
    if(b.big && b.state === "normal"){

      for(let i = 0; i < letterPositions.length; i++){

        const p = letterPositions[i];

        const dx = Math.abs(b.x - p.x);
        const dy = Math.abs(b.y - p.y);

        /* precisa ENCAIXAR exatamente */
        if(dx < 3 && dy < 3 && slots[i] === null){
          b.state = "waiting";
          b.targetIndex = i;
        }
      }
    }

    /* ⏳ espera no ponto exato */
    if(b.state === "waiting"){
      b.timer++;

      if(b.timer > 60){
        slots[b.targetIndex] = letters[b.targetIndex];
        renderLetters();

        b.state = "done";
      }
    }

    /* reset */
    if(b.state === "done"){
      b.y = canvas.height + 50;
      b.x = Math.random() * canvas.width;

      b.state = "normal";
      b.timer = 0;
      b.targetIndex = -1;
    }

    /* reset normal */
    if(b.y < -30){
      b.y = canvas.height + 30;
      b.x = Math.random() * canvas.width;
    }
  }
}

renderLetters();
animate();

window.addEventListener("resize", ()=>{
  resize();
  updatePositions();
});

</script>

</body>
  </html>
