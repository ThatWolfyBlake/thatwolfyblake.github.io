<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lullaby</title>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden; /* sem scroll */
    }

    img {
      cursor: pointer;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

  <img src="bat.png" id="trigger">

  <audio id="audio" src="placeholder.ogg"></audio>

  <script>
    const img = document.getElementById("trigger");
    const audio = document.getElementById("audio");

    img.onclick = () => {
      audio.play();
    };
  </script>

</body>
</html>
