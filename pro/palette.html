
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#31022B">
  <title>Color Palette Generator | PRO</title>

  <style>
    :root {
      --purple: #950DA9;
      --deep: #31022B;
      --pink: #B6437F;
      --ink: #090309;
      --paper: #f8eefa;
      --muted: rgba(255,255,255,.58);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--paper);
      background:
        radial-gradient(ellipse at 12% 12%, rgba(149,13,169,.28), transparent 34rem),
        radial-gradient(ellipse at 90% 85%, rgba(182,67,127,.19), transparent 30rem),
        var(--deep);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background-image: radial-gradient(
        rgba(255,255,255,.65) .7px,
        transparent .7px
      );
      background-size: 23px 23px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .shell {
      width: min(850px, calc(100% - 40px));
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    header {
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: white;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 900;
      letter-spacing: .18em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--purple);
      border-radius: 11px;
      font-size: 1rem;
      box-shadow: 0 0 28px rgba(149,13,169,.4);
    }

    .top-note {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      padding: 55px 0 65px;
    }

    .heading {
      margin-bottom: 35px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 17px;
      color: #D99AE0;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 27px;
      height: 2px;
      background: var(--pink);
    }

    h1 {
      margin: 0;
      color: white;
      font-size: clamp(2.5rem, 8vw, 4.8rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 950;
    }

    .subtitle {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 27px;
    }

    .button {
      min-height: 52px;
      padding: 0 21px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      color: white;
      font-size: .9rem;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease,
        box-shadow .2s ease, opacity .2s ease;
    }

    .button:hover:not(:disabled),
    .button:focus-visible:not(:disabled) {
      transform: translateY(-3px);
      outline: none;
    }

    .button:disabled {
      opacity: .3;
      cursor: not-allowed;
      box-shadow: none;
    }

    .button.generate {
      background: linear-gradient(135deg, #B51AC5, #760B83);
      box-shadow: 0 8px 25px rgba(149,13,169,.25);
    }

    .button.generate:hover {
      background: var(--pink);
    }

    .button.copy-all {
      background: var(--deep);
    }

    .button.copy-all:hover:not(:disabled) {
      background: #57104F;
    }

    .button.history {
      background: #57104F;
    }

    .button.history:hover:not(:disabled) {
      background: var(--pink);
    }

    .button .symbol {
      font-size: 1.2rem;
    }

    .palette {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .color-card {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 12px;
      min-width: 0;
      animation: appear .35s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .color-swatch {
      min-height: 120px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,.13);
      transition: transform .2s ease;
    }

    .color-swatch:hover {
      transform: scale(1.035);
    }

    .star {
      font-size: 3.6rem;
      line-height: 1;
      user-select: none;
    }

    .color-info {
      min-width: 0;
      min-height: 120px;
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 20px;
      cursor: pointer;
      transition: transform .2s ease, filter .2s ease;
    }

    .color-info:hover {
      filter: brightness(1.08);
      transform: translateX(3px);
    }

    .color-name {
      margin: 0 0 5px;
      font-family: Georgia, serif;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 800;
      letter-spacing: -.035em;
    }

    .color-value {
      margin: 2px 0;
      font-size: .83rem;
      font-weight: 650;
      letter-spacing: .015em;
      overflow-wrap: anywhere;
    }

    .color-value strong {
      font-weight: 900;
      margin-right: 5px;
    }

    .hint {
      margin: 22px 0 0;
      color: rgba(255,255,255,.48);
      font-size: .78rem;
      text-align: center;
    }

    .status {
      min-height: 22px;
      margin-top: 15px;
      color: #E6B2EC;
      font-size: .82rem;
      font-weight: 750;
      text-align: center;
    }

    footer {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: rgba(255,255,255,.48);
      font-size: .72rem;
      letter-spacing: .08em;
    }

    footer strong {
      color: rgba(255,255,255,.78);
      font-weight: 800;
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 28px, 850px);
      }

      header {
        min-height: 70px;
      }

      .top-note {
        font-size: .59rem;
        letter-spacing: .1em;
        text-align: right;
      }

      main {
        padding: 38px 0 45px;
      }

      .heading {
        margin-bottom: 27px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .button {
        width: 100%;
        padding: 0 12px;
        font-size: .8rem;
        gap: 7px;
      }

      .button.generate,
      .button.copy-all {
        grid-column: span 2;
      }

      .color-card {
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 8px;
      }

      .color-swatch {
        min-height: 112px;
        border-radius: 15px;
      }

      .star {
        font-size: 2.7rem;
      }

      .color-info {
        min-height: 112px;
        padding: 12px 14px;
        border-radius: 15px;
      }

      .color-name {
        font-size: 1.25rem;
      }

      .color-value {
        font-size: .72rem;
      }

      footer {
        align-items: flex-start;
        justify-content: center;
        flex-direction: column;
        padding: 18px 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="shell">

    <header>
      <a class="brand" href="index.html" aria-label="PRO home">
        <span class="brand-mark">P</span>
        <span>PRO</span>
      </a>

      <span class="top-note">Color tools</span>
    </header>

    <main>
      <section class="heading">
        <p class="eyebrow">Creative tools</p>
        <h1>Color palette generator</h1>
        <p class="subtitle">
          Need some colors? Generate a palette of five matching colors
          for your next project!
        </p>
      </section>

      <div class="toolbar">

        <button class="button generate" onclick="generatePalette()">
          <span class="symbol">✦</span>
          Generate palette
        </button>

        <button class="button history" id="undoButton"
          onclick="undoPalette()" disabled>
          <span class="symbol">↶</span>
          Undo
        </button>

        <button class="button history" id="redoButton"
          onclick="redoPalette()" disabled>
          <span class="symbol">↷</span>
          Redo
        </button>

        <button class="button copy-all" onclick="copyAll()">
          <span class="symbol">▣</span>
          Copy all HEX codes
        </button>

      </div>

      <section class="palette" id="palette"
        aria-label="Generated color palette">
      </section>

      <p class="hint">
        Click any color card to copy its HEX code.
      </p>

      <div class="status" id="status" aria-live="polite"></div>
    </main>

    <footer>
      <span><strong>PRO</strong> &nbsp;·&nbsp; Projects, ideas &amp; more</span>
      <span>Made to explore.</span>
    </footer>

  </div>

  <script>
    let currentPalette = [];

    // Palette history
    let paletteHistory = [];
    let historyIndex = -1;

    const paletteElement = document.getElementById("palette");
    const statusElement = document.getElementById("status");
    const undoButton = document.getElementById("undoButton");
    const redoButton = document.getElementById("redoButton");

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function hslToRgb(h, s, l) {
      s /= 100;
      l /= 100;

      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);

      const f = n =>
        l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));

      return [
        Math.round(f(0) * 255),
        Math.round(f(8) * 255),
        Math.round(f(4) * 255)
      ];
    }

    function rgbToHex(rgb) {
      return "#" + rgb.map(value =>
        value.toString(16).padStart(2, "0")
      ).join("").toUpperCase();
    }

    function generateColors() {
      const baseHue = random(0, 360);
      const baseSaturation = random(35, 65);

      const variations = [
        { hue: 0, light: random(84, 94), sat: 0 },
        { hue: random(-15, 15), light: random(68, 79), sat: -5 },
        { hue: random(-20, 20), light: random(48, 60), sat: 5 },
        { hue: random(-25, 25), light: random(29, 41), sat: 0 },
        { hue: random(-30, 30), light: random(12, 23), sat: 5 }
      ];

      return variations.map(variation => {
        let hue = (baseHue + variation.hue + 360) % 360;

        let saturation = Math.min(
          90,
          Math.max(15, baseSaturation + variation.sat)
        );

        let lightness = variation.light;

        const rgb = hslToRgb(hue, saturation, lightness);

        return {
          hex: rgbToHex(rgb),
          rgb: rgb,
          lightness: lightness
        };
      });
    }

    function getTextColor(lightness) {
      return lightness > 55 ? "#180D17" : "#FFFFFF";
    }

    function renderPalette() {
      paletteElement.innerHTML = "";

      currentPalette.forEach((color, index) => {
        const textColor = getTextColor(color.lightness);

        const card = document.createElement("article");
        card.className = "color-card";
        card.style.animationDelay = `${index * 55}ms`;

        const swatch = document.createElement("div");
        swatch.className = "color-swatch";
        swatch.style.background = color.hex;
        swatch.style.color = textColor;
        swatch.innerHTML = '<span class="star">✦</span>';
        swatch.title = "Click to copy " + color.hex;
        swatch.setAttribute("role", "button");
        swatch.setAttribute("tabindex", "0");
        swatch.setAttribute("aria-label", "Copy " + color.hex);

        const info = document.createElement("div");
        info.className = "color-info";
        info.style.background = color.hex;
        info.style.color = textColor;
        info.title = "Click to copy " + color.hex;

        const name = document.createElement("h2");
        name.className = "color-name";
        name.textContent = `Color ${String(index + 1).padStart(2, "0")}`;

        const hex = document.createElement("p");
        hex.className = "color-value";
        hex.innerHTML = `<strong>HEX</strong> ${color.hex}`;

        const rgb = document.createElement("p");
        rgb.className = "color-value";
        rgb.innerHTML = `<strong>RGB</strong> ${color.rgb.join(", ")}`;

        info.append(name, hex, rgb);
        card.append(swatch, info);

        const copy = () => copyHex(color.hex);

        swatch.addEventListener("click", copy);
        info.addEventListener("click", copy);

        swatch.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            copy();
          }
        });

        paletteElement.appendChild(card);
      });

      updateHistoryButtons();
    }

    // Update Undo and Redo availability
    function updateHistoryButtons() {
      undoButton.disabled = historyIndex <= 0;
      redoButton.disabled = historyIndex >= paletteHistory.length - 1;
    }

    // Save a newly generated palette
    function saveToHistory(palette) {
      // Remove future palettes if the user generated after undoing
      paletteHistory = paletteHistory.slice(0, historyIndex + 1);

      // Save a copy of the palette
      paletteHistory.push(JSON.parse(JSON.stringify(palette)));

      historyIndex = paletteHistory.length - 1;

      currentPalette = paletteHistory[historyIndex];

      renderPalette();
    }

    // Generate a new palette
    function generatePalette() {
      const newPalette = generateColors();

      saveToHistory(newPalette);

      statusElement.textContent = "A new palette has been generated!";
    }

    // Go back to the previous palette
    function undoPalette() {
      if (historyIndex <= 0) return;

      historyIndex--;

      currentPalette = paletteHistory[historyIndex];

      renderPalette();

      statusElement.textContent = "Returned to the previous palette.";
    }

    // Restore a palette that was undone
    function redoPalette() {
      if (historyIndex >= paletteHistory.length - 1) return;

      historyIndex++;

      currentPalette = paletteHistory[historyIndex];

      renderPalette();

      statusElement.textContent = "Palette restored!";
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";

          document.body.appendChild(textarea);
          textarea.select();

          const successful = document.execCommand("copy");
          textarea.remove();

          if (!successful) throw new Error("Copy failed");
        }

        return true;
      } catch (error) {
        statusElement.textContent = "Could not copy. Please try again.";
        return false;
      }
    }

    async function copyHex(hex) {
      const success = await copyText(hex);

      if (success) {
        statusElement.textContent = `${hex} copied to clipboard!`;
      }
    }

    async function copyAll() {
      const allHex = currentPalette
        .map(color => color.hex)
        .join("\n");

      const success = await copyText(allHex);

      if (success) {
        statusElement.textContent = "All 5 HEX codes copied!";
      }
    }

    // Generate the first palette on page load
    generatePalette();
  </script>
</body>
</html>
