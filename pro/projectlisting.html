<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Project Listing</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c2f;--panel2:#1b2740;--text:#edf2ff;--muted:#9aa8c2;--line:#293650;--accent:#8b9cff;--accent2:#b5c0ff;--green:#55d6a2;--yellow:#f5c66b;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1b2850 0,var(--bg) 55%);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:42px 0 60px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.eyebrow{color:var(--accent2);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:7px 0 5px;font-size:clamp(30px,5vw,44px);line-height:1.1;letter-spacing:-.04em}.sub{margin:0;color:var(--muted)}
button,input,select,textarea{font:inherit}button,.nav-link{cursor:pointer}.primary{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:12px 17px;color:#10162a;background:var(--accent2);font-weight:800;text-decoration:none}.primary:hover{filter:brightness(1.08)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px;margin-bottom:22px;background:#111a2c;border:1px solid var(--line);border-radius:16px}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{min-width:0;color:var(--text);background:#0d1526;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.toolbar input{flex:1 1 220px}.toolbar select{flex:0 1 180px}input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}.stat{flex:1 1 130px;padding:13px 15px;background:rgba(20,28,47,.85);border:1px solid var(--line);border-radius:14px}.stat strong{display:block;font-size:23px}.stat span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}.card{display:flex;flex-direction:column;min-height:220px;padding:18px;background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:17px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#303d60;color:#dbe2ff}.status{font-size:11px;font-weight:800}
.status.Completed{color:var(--green)}.status.In-progress{color:var(--yellow)}.status.Planned{color:var(--accent2)}.status.Canceled,.status.Redacted{color:var(--red)}
.card h2{margin:16px 0 7px;font-size:19px}.card p{margin:0;color:var(--muted);font-size:13px}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:18px;color:var(--muted);font-size:11px}
.actions{display:flex;gap:7px;margin-top:13px}.small{padding:7px 10px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:#10192b;font-size:12px}.small:hover{border-color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;padding:55px 20px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
dialog{width:min(480px,calc(100% - 28px));padding:0;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:18px}dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.modal{padding:22px}.modal h2{margin:0 0 17px}.field{display:grid;gap:6px;margin:12px 0}.field label{color:var(--muted);font-size:12px;font-weight:700}.field textarea{min-height:85px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.secondary{padding:10px 14px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:transparent}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}.nav .primary{font-size:11px;padding:9px 14px}footer{margin-top:30px;text-align:center;color:var(--muted);font-size:11px}
@media(max-width:600px){.wrap{padding-top:28px}header{align-items:flex-start;flex-direction:column}header .primary{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<header><div><div class="eyebrow">Workspace / Overview</div><h1>My Projects</h1><p class="sub">A simple place to organize and track your work.</p></div><button class="primary" id="addBtn" type="button">＋ Add project here</button></header>
<section class="stats" aria-label="Project statistics">
<div class="stat"><strong id="totalCount">0</strong><span>Total projects</span></div>
<div class="stat"><strong id="progressCount">0</strong><span>In progress</span></div>
<div class="stat"><strong id="completedCount">0</strong><span>Completed</span></div>
<div class="stat"><strong id="canceledCount">0</strong><span>Canceled</span></div>
<div class="stat"><strong id="redactedCount">0</strong><span>Redacted</span></div>
</section>
<section class="toolbar" aria-label="Search and filters">
<input id="search" type="search" placeholder="Search projects..." aria-label="Search projects">
<select id="statusFilter" aria-label="Filter by status"><option value="All">All statuses</option><option>Planned</option><option>In progress</option><option>Completed</option><option>Canceled</option><option>Redacted</option></select>
<select id="categoryFilter" aria-label="Filter by category"><option value="All">All categories</option><option>Web</option><option>App</option><option>Game</option><option>Story</option><option>Arg</option></select>
</section>
<section class="grid" id="projectGrid" aria-live="polite"></section>
<nav class="nav" aria-label="Site navigation">
<a class="primary nav-link" href="https://thatwolfyblake.github.io/pro/index.html">Home</a>
<a class="primary nav-link" href="https://thatwolfyblake.github.io/timerune/chapter2" aria-label="More">...</a>
<button class="primary" id="videosBtn" type="button" title="Set the Videos page URL in the HTML">Videos</button>
</nav>
<footer>Projects are saved in this browser on this device.</footer>
</main>
<dialog id="projectDialog">
<form class="modal" id="projectForm">
<h2 id="dialogTitle">Add a project</h2><input type="hidden" id="projectId">
<div class="field"><label for="name">Project name</label><input id="name" required maxlength="60" placeholder="e.g. Personal website"></div>
<div class="field"><label for="description">Description</label><textarea id="description" maxlength="220" placeholder="What is this project about?"></textarea></div>
<div class="field"><label for="category">Category</label><select id="category"><option>Web</option><option>App</option><option>Game</option><option>Story</option><option>Arg</option></select></div>
<div class="field"><label for="status">Status</label><select id="status"><option>Planned</option><option>In progress</option><option>Completed</option><option>Canceled</option><option>Redacted</option></select></div>
<div class="field"><label for="dueDate">Target date (optional)</label><input id="dueDate" type="date"></div>
<div class="modal-actions"><button type="button" class="secondary" id="cancelBtn">Cancel</button><button type="submit" class="primary">Save project</button></div>
</form>
</dialog>
<script>
const starterProjects=[
{id:1,name:"Personal Portfolio",description:"A website to showcase my work, skills, and contact information.",category:"Web",status:"In progress",dueDate:""},
{id:2,name:"Mobile Game Concept",description:"An early prototype for a small game project.",category:"Game",status:"Planned",dueDate:""},
{id:3,name:"Task Tracker",description:"A lightweight app for organizing everyday tasks.",category:"App",status:"Completed",dueDate:""}
];
const STORAGE_KEY="project-listing-v1";
const $=id=>document.getElementById(id);
const grid=$("projectGrid"),dialog=$("projectDialog");
function loadProjects(){
 try{const saved=localStorage.getItem(STORAGE_KEY);if(!saved)return [...starterProjects];const data=JSON.parse(saved);return Array.isArray(data)?data:[...starterProjects]}
 catch{return [...starterProjects]}
}
let projects=loadProjects();
function saveProjects(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(projects))}
 catch{alert("Could not save in this browser. Your changes may not persist.")}
}
function render(){
 $("totalCount").textContent=projects.length;
 $("progressCount").textContent=projects.filter(p=>p.status==="In progress").length;
 $("completedCount").textContent=projects.filter(p=>p.status==="Completed").length;
 $("canceledCount").textContent=projects.filter(p=>p.status==="Canceled").length;
 $("redactedCount").textContent=projects.filter(p=>p.status==="Redacted").length;
 const query=$("search").value.trim().toLowerCase(),status=$("statusFilter").value,category=$("categoryFilter").value;
 const visible=projects.filter(p=>(String(p.name||"")+" "+String(p.description||"")).toLowerCase().includes(query)&&(status==="All"||p.status===status)&&(category==="All"||p.category===category));
 grid.replaceChildren();
 if(!visible.length){const empty=document.createElement("div");empty.className="empty";empty.textContent=projects.length?"No projects match your filters.":"No projects yet. Add your first project!";grid.append(empty);return}
 visible.forEach(p=>{
  const card=document.createElement("article");card.className="card";
  const top=document.createElement("div");top.className="card-top";
  const tag=document.createElement("span");tag.className="tag";tag.textContent=p.category;
  const state=document.createElement("span");state.className="status "+String(p.status).replaceAll(" ","-");state.textContent=p.status;
  const title=document.createElement("h2");title.textContent=p.name;
  const desc=document.createElement("p");desc.textContent=p.description||"No description provided.";
  const meta=document.createElement("div");meta.className="meta";
  const date=document.createElement("span");date.textContent=p.dueDate?"Target: "+p.dueDate:"No target date";
  const label=document.createElement("span");label.textContent="Project";meta.append(date,label);
  const actions=document.createElement("div");actions.className="actions";
  const edit=document.createElement("button");edit.type="button";edit.className="small";edit.textContent="Edit";edit.addEventListener("click",()=>openEditor(p.id));
  const del=document.createElement("button");del.type="button";del.className="small";del.textContent="Delete";del.addEventListener("click",()=>deleteProject(p.id));
  top.append(tag,state);actions.append(edit,del);card.append(top,title,desc,meta,actions);grid.append(card);
 });
}
function openEditor(id=null){
 $("projectForm").reset();$("projectId").value="";$("dialogTitle").textContent=id===null?"Add a project":"Edit project";
 if(id!==null){const p=projects.find(item=>item.id===id);if(!p)return;$("projectId").value=p.id;$("name").value=p.name||"";$("description").value=p.description||"";$("category").value=p.category||"Web";$("status").value=p.status||"Planned";$("dueDate").value=p.dueDate||""}
 dialog.showModal();$("name").focus();
}
function deleteProject(id){
 const p=projects.find(item=>item.id===id);if(!p||!confirm(`Delete "${p.name}"? This cannot be undone.`))return;
 projects=projects.filter(item=>item.id!==id);saveProjects();render();
}
$("addBtn").addEventListener("click",()=>openEditor());
$("cancelBtn").addEventListener("click",()=>dialog.close());
$("projectForm").addEventListener("submit",event=>{
 event.preventDefault();const id=$("projectId").value;
 const project={id:id?Number(id):Date.now(),name:$("name").value.trim(),description:$("description").value.trim(),category:$("category").value,status:$("status").value,dueDate:$("dueDate").value};
 if(!project.name)return;
 if(id)projects=projects.map(p=>p.id===project.id?project:p);else projects.unshift(project);
 saveProjects();render();dialog.close();
});
["search","statusFilter","categoryFilter"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));
$("videosBtn").addEventListener("click",()=>alert("Add your Videos page URL to the Videos button in the HTML."));
render();
</script>
</body>
                                                                                                                                                    </html>
