<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160A05">
<title>Events — Liron's Museum</title>

<style>
:root {
  --bg: #160A05;
  --chocolate: #241006;
  --panel: #2B1408;
  --orange: #FF9B32;
  --gold: #FFB65B;
  --cream: #FFE5C5;
  --beige: #D9BDA5;
  --muted: #987B68;
  --border: #FF8C42;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  font-family: system-ui, "Segoe UI", sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, #54270f 0%, transparent 48%),
    radial-gradient(ellipse at 100% 45%, #351509 0%, transparent 40%),
    linear-gradient(145deg, var(--chocolate), var(--bg) 65%);
}

.page {
  width: min(100% - 32px, 760px);
  margin: auto;
  padding: 30px 0 56px;
}

/* HEADER */

header {
  text-align: center;
  margin-bottom: 28px;
}

.brand {
  display: inline-block;
  color: var(--orange);
  font-size: clamp(2rem, 7vw, 3.3rem);
  font-weight: 850;
  letter-spacing: -.045em;
  text-decoration: none;
  text-shadow: 0 0 22px #ff8c4238;
}

.brand:hover {
  color: var(--gold);
}

.subtitle {
  color: var(--beige);
  margin: 8px 0 0;
  font-size: 1.05rem;
}

/* NAVIGATION */

.nav-wrap {
  position: sticky;
  top: 0;
  z-index: 5;
  padding: 10px 0 14px;
  background: linear-gradient(#1d0c05f2, #1d0c05e8);
  backdrop-filter: blur(10px);
}

nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: nowrap;
  overflow-x: auto;
  padding: 3px 0 7px;
  scrollbar-width: thin;
}

nav a {
  flex: 0 0 auto;
  border: 1px solid #70401f;
  background: #2b1408;
  color: var(--beige);
  padding: 10px 14px;
  border-radius: 12px;
  font: 750 .9rem system-ui;
  text-decoration: none;
  transition: .18s;
}

nav a:hover {
  border-color: var(--border);
  color: var(--cream);
  transform: translateY(-1px);
}

/* EVENT HERO */

.event-hero {
  text-align: center;
  padding: 42px 20px;
  margin-top: 25px;
  border: 1px solid #87431f;
  border-radius: 18px;
  background:
    radial-gradient(ellipse at 50% 0%, #70351055, transparent 75%),
    linear-gradient(160deg, #3b1d0d99, #241006d9);
  box-shadow: 0 10px 35px #00000025;
}

.event-label {
  display: inline-block;
  padding: 6px 12px;
  border: 1px solid #a85a2b;
  border-radius: 8px;
  background: #3b1d0d;
  color: var(--gold);
  font-size: .72rem;
  font-weight: 850;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.event-hero h1 {
  margin: 16px 0 8px;
  color: var(--orange);
  font-size: clamp(2.2rem, 8vw, 3.5rem);
  font-weight: 900;
  letter-spacing: -.045em;
  text-shadow: 0 0 20px #ff9b3230;
}

.event-description {
  max-width: 500px;
  margin: auto;
  color: var(--beige);
  font-size: .98rem;
  line-height: 1.6;
}

/* SECTION HEADINGS */

.section-head {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 42px 0 18px;
}

.section-head h2 {
  margin: 0;
  color: var(--orange);
  font-size: 1.7rem;
  font-weight: 850;
  letter-spacing: -.03em;
  text-shadow: 0 0 15px #ff9b3224;
}

.section-head .line {
  height: 1px;
  flex: 1;
  background: linear-gradient(
    90deg,
    #9b542a,
    #482312 75%,
    transparent
  );
}

.section-description {
  color: var(--beige);
  margin: -6px 0 22px;
}

/* TOON GRID */

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.toon-card {
  display: block;
  min-width: 0;
  text-align: center;
  padding: 12px;
  border: 1px solid #87431f;
  border-radius: 15px;
  background: linear-gradient(160deg, #3b1d0d99, #241006d9);
  box-shadow: 0 8px 24px #00000020;
  transition: transform .2s, border-color .2s;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}

.toon-card:hover {
  transform: translateY(-4px);
  border-color: var(--orange);
  box-shadow: 0 8px 28px #ff9b3220;
}

.toon-card:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

.portrait {
  aspect-ratio: 1 / 1;
  width: 100%;
  border-radius: 11px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: radial-gradient(
    circle at 50% 35%,
    #6c3518,
    #2b1408 70%
  );
  border: 1px solid #a85a2b55;
  position: relative;
}

.portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.placeholder {
  font-size: clamp(2rem, 8vw, 4rem);
  font-weight: 850;
  color: var(--gold);
  text-shadow: 0 0 20px #ff9b3255;
}

.portrait:after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    transparent 65%,
    #160a0540
  );
}

.toon-name {
  margin: 11px 0 1px;
  font-weight: 800;
  color: var(--cream);
  font-size: 1rem;
  overflow-wrap: anywhere;
}

/* EVENT FEATURE */

.feature-card {
  position: relative;
  overflow: hidden;
  padding: 30px 22px;
  border: 1px solid #87431f;
  border-radius: 16px;
  background:
    radial-gradient(ellipse at 100% 0%, #70351044, transparent 65%),
    linear-gradient(160deg, #3b1d0d99, #241006d9);
  box-shadow: 0 8px 24px #00000020;
  text-align: center;
}

.feature-icon {
  font-size: 2.8rem;
  margin-bottom: 12px;
  filter: drop-shadow(0 0 12px #ff9b3255);
}

.feature-card h3 {
  margin: 0 0 10px;
  color: var(--gold);
  font-size: 1.5rem;
  font-weight: 850;
}

.feature-card p {
  margin: 0;
  color: var(--beige);
  line-height: 1.6;
}

.feature-placeholder {
  display: inline-block;
  margin-top: 20px;
  padding: 9px 16px;
  border: 1px dashed #a85a2b;
  border-radius: 9px;
  background: #2b140866;
  color: var(--muted);
  font-size: .8rem;
  font-weight: 750;
}

/* UNKNOWN EVENT */

.error-card {
  text-align: center;
  padding: 45px 20px;
  margin-top: 30px;
  border: 1px dashed #87502d;
  border-radius: 15px;
  background: #2b140866;
  color: var(--beige);
}

.error-card h2 {
  color: var(--gold);
  margin-top: 0;
}

/* FOOTER */

footer {
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
  margin-top: 42px;
}

/* MOBILE */

@media(max-width:520px) {

  .page {
    width: min(100% - 22px, 760px);
    padding-top: 22px;
  }

  nav {
    justify-content: flex-start;
  }

  nav a {
    padding: 9px 12px;
    font-size: .82rem;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
  }

  .toon-card {
    padding: 9px;
  }

  .section-head h2 {
    font-size: 1.5rem;
  }

  .event-hero {
    padding: 32px 16px;
  }
}

@media(min-width:680px) {
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<div class="page">

  <header>
    <a class="brand" href="/lirons-museum/">
      Liron's Museum
    </a>

    <p class="subtitle">
      A little collection of extraordinary toons.
    </p>
  </header>

  <div class="nav-wrap">
    <nav aria-label="Museum navigation">
      <a href="/lirons-museum/">Home</a>
      <a href="/lirons-museum/see-toons.html">See Toons</a>
    </nav>
  </div>

  <main id="eventContent">

    <!-- EVENT HERO -->

    <section class="event-hero">
      <span class="event-label">Museum Event</span>

      <h1 id="eventTitle">Loading...</h1>

      <p class="event-description" id="eventDescription"></p>
    </section>

    <!-- SECTION 1: TOONS -->

    <section>

      <div class="section-head">
        <h2>Event Toons</h2>
        <span class="line"></span>
      </div>

      <p class="section-description">
        Meet the special toons featured in this event.
        Select a toon to discover more about them.
      </p>

      <div class="grid" id="toonGrid"></div>

    </section>

    <!-- SECTION 2: EVENT FEATURES -->

    <section>

      <div class="section-head">
        <h2>Event Features</h2>
        <span class="line"></span>
      </div>

      <div class="feature-card">

        <div class="feature-icon" id="featureIcon"></div>

        <h3 id="featureTitle"></h3>

        <p id="featureDescription"></p>

        <div class="feature-placeholder" id="featurePlaceholder">
          Coming Soon
        </div>

      </div>

    </section>

  </main>

  <footer>
    © Liron's Museum · Every toon has a story.
  </footer>

</div>

<script>

/* CHARACTER DATA */

const events = {

  Hallow: {

    title: "A Hallow",

    description:
      "Something mysterious is happening at Liron's Museum... " +
      "Explore the Halloween collection and meet its special toons!",

    toons: [
      "Batly",
      "Billy",
      "Harley",
      "Candy SugarTooth"
    ],

    feature: {

      icon: "🎃",

      title: "Trick or Treat",

      description:
        "Get ready for some Halloween fun! " +
        "Discover the event's special trick-or-treat feature.",

      placeholder: "Trick or Treat"

    }

  },

  EggHunt: {

    title: "Great EggHunt",

    description:
      "The Easter season has arrived! " +
      "Meet the special toons celebrating this egg-cellent event.",

    toons: [
      "Eggsley",
      "Carrol Bluefield",
      "Basley",
      "Choccy Vanilloa"
    ],

    feature: {

      icon: "🥚",

      title: "Egg Hunting",

      description:
        "Something is hidden around the museum... " +
        "Get ready to explore and discover the Easter event feature!",

      placeholder: "Egg Hunting"

    }

  },

  Gifting: {

    title: "Winter Gifting",

    description:
      "Winter has arrived at Liron's Museum! " +
      "Discover the festive toons and celebrate the season of giving.",

    toons: [
      "Henry",
      "Frostey",
      "Cappy",
      "Fiona Starling"
    ],

    feature: {

      icon: "🎁",

      title: "Open Gifts",

      description:
        "The museum is full of surprises! " +
        "Discover the special gifts waiting for you this winter.",

      placeholder: "Open Gifts"

    }

  }

};

/* UTILITIES */

function slugify(name) {

  return name.toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");

}

/* GET EVENT FROM URL */

function getEventFromURL() {

  const params = new URLSearchParams(window.location.search);

  // Supports ?=Hallow, ?=EggHunt and ?=Gifting
  // Also supports ?event=Hallow as an alternative.

  return params.get("") || params.get("event");

}

/* CREATE TOON CARDS */

function createToonCard(name) {

  const card = document.createElement("a");

  card.className = "toon-card";

  card.href =
    "/lirons-museum/toon-card.html?="
    + encodeURIComponent(name);

  card.setAttribute("aria-label", "View " + name);

  const slug = slugify(name);

  card.innerHTML = `

    <div class="portrait">

      <img
        src="/lirons-museum/assets/${slug}.png"
        alt="${name}"
        loading="lazy"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='grid';
        "
      >

      <span
        class="placeholder"
        style="display:none"
        aria-hidden="true"
      >${name.charAt(0)}</span>

    </div>

    <div class="toon-name">${name}</div>

  `;

  return card;

}

/* RENDER EVENT */

function renderEvent(eventKey) {

  const event = events[eventKey];

  const content = document.getElementById("eventContent");

  if (!event) {

    content.innerHTML = `

      <div class="error-card">

        <h2>Event Not Found</h2>

        <p>
          We couldn't find this event.
          Please check the event link and try again.
        </p>

        <a
          href="/lirons-museum/"
          class="event-placeholder"
        >
          Return to Museum
        </a>

      </div>

    `;

    document.title = "Event Not Found — Liron's Museum";

    return;

  }

  /* PAGE TITLE */

  document.title = event.title + " — Liron's Museum";

  /* HERO */

  document.getElementById("eventTitle").textContent =
    event.title;

  document.getElementById("eventDescription").textContent =
    event.description;

  /* TOONS */

  const grid = document.getElementById("toonGrid");

  grid.innerHTML = "";

  event.toons.forEach(name => {

    grid.appendChild(createToonCard(name));

  });

  /* EVENT FEATURE */

  document.getElementById("featureIcon").textContent =
    event.feature.icon;

  document.getElementById("featureTitle").textContent =
    event.feature.title;

  document.getElementById("featureDescription").textContent =
    event.feature.description;

  document.getElementById("featurePlaceholder").textContent =
    event.feature.placeholder;

}

/* INITIALIZE */

const currentEvent = getEventFromURL();

renderEvent(currentEvent);

</script>

</body>
</html>
