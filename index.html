
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06152F">
<title>Wolfy's Posts</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #06152F;
    --panel: rgba(9,29,65,.94);
    --panel-light: rgba(20,48,91,.75);
    --blue: #2475E8;
    --bright: #48A5FF;
    --text: #F1F6FF;
    --muted: #9DB2D1;
    --border: rgba(100,160,255,.18);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 15% 10%, rgba(36,117,232,.22), transparent 35%),
        radial-gradient(circle at 90% 80%, rgba(72,165,255,.12), transparent 35%),
        radial-gradient(rgba(120,170,255,.08) 1px, transparent 1px),
        var(--bg);
    background-size: auto, auto, 22px 22px, auto;
}

a {
    color: inherit;
    text-decoration: none;
}

.page {
    width: min(760px, calc(100% - 28px));
    margin: 35px auto;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 20px;
    margin-bottom: 22px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--panel);
    box-shadow: 0 12px 35px rgba(0,0,0,.2);
}

.header-title {
    font-size: 23px;
    font-weight: 800;
}

.header-subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

.profile-link {
    padding: 10px 14px;
    border-radius: 9px;
    background: #183F78;
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    transition: .2s;
}

.profile-link:hover {
    background: var(--blue);
    transform: translateY(-2px);
}

/* FEED */

.feed {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.post {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--panel);
    box-shadow: 0 12px 35px rgba(0,0,0,.18);
    transition: border-color .2s;
}

.post:hover {
    border-color: rgba(72,165,255,.4);
}

.post-content {
    padding: 20px;
}

.post-author {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 17px;
}

.post-avatar {
    width: 39px;
    height: 39px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(72,165,255,.35);
}

.author-name {
    font-size: 13px;
    font-weight: 800;
}

.author-username {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
}

.post-title {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    overflow-wrap: anywhere;
}

.post-text {
    margin-top: 11px;
    color: #D1E0F5;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

/* IMAGES */

.post-images {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px;
    margin-top: 16px;
    overflow: hidden;
    border-radius: 11px;
}

.post-images.single {
    grid-template-columns: 1fr;
}

.post-images img {
    display: block;
    width: 100%;
    max-height: 380px;
    min-height: 120px;
    object-fit: cover;
    background: #102B55;
}

.post-images.single img {
    max-height: 500px;
}

/* BUTTONS */

.post-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 17px;
}

.post-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 15px;
    border-radius: 9px;
    background: #183F78;
    border: 1px solid rgba(100,160,255,.25);
    color: white;
    font-size: 12px;
    font-weight: 700;
    transition: .2s;
}

.post-button:hover {
    background: var(--blue);
    border-color: var(--bright);
    transform: translateY(-2px);
}

/* EMPTY FEED */

.no-posts {
    padding: 35px 15px;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: var(--panel);
}

/* FOOTER */

.footer {
    margin-top: 25px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
}

/* MOBILE */

@media(max-width:600px) {
    .page {
        margin: 15px auto;
    }

    .header {
        padding: 16px;
    }

    .header-title {
        font-size: 20px;
    }

    .post-content {
        padding: 16px;
    }

    .post-title {
        font-size: 18px;
    }

    .post-images img {
        min-height: 100px;
    }
}
</style>
</head>

<body>

<main class="page">

    <header class="header">
        <div>
            <div class="header-title">Wolfy's Posts</div>
            <div class="header-subtitle">Updates, projects and random stuff!</div>
        </div>

        <a class="profile-link" href="about-me.html">
            My Profile ↗
        </a>
    </header>

    <div class="feed" id="postsList">
        <div class="no-posts">Loading posts...</div>
    </div>

    <footer class="footer">
        Made by Wolfy ✦
    </footer>

</main>

<script src="posts.js"></script>

<script>
const postsList = document.getElementById("postsList");

function renderPosts() {
    postsList.replaceChildren();

    if (!Array.isArray(window.WOLFY_POSTS) || window.WOLFY_POSTS.length === 0) {
        const empty = document.createElement("div");
        empty.className = "no-posts";
        empty.textContent = "No posts yet. Check back later!";
        postsList.appendChild(empty);
        return;
    }

    window.WOLFY_POSTS.forEach(post => {
        const card = document.createElement("article");
        card.className = "post";

        const content = document.createElement("div");
        content.className = "post-content";

        /* AUTHOR */

        const author = document.createElement("div");
        author.className = "post-author";

        const avatar = document.createElement("img");
        avatar.className = "post-avatar";
        avatar.src = "https://thatwolfyblake.github.io/assets/pfp.png";
        avatar.alt = "Wolfy";

        const authorInfo = document.createElement("div");

        const authorName = document.createElement("div");
        authorName.className = "author-name";
        authorName.textContent = "Wolfy";

        const username = document.createElement("div");
        username.className = "author-username";
        username.textContent = "@Thatwolfyblake";

        authorInfo.append(authorName, username);
        author.append(avatar, authorInfo);
        content.appendChild(author);

        /* TITLE */

        if (post.title) {
            const title = document.createElement("h2");
            title.className = "post-title";
            title.textContent = post.title;
            content.appendChild(title);
        }

        /* TEXT */

        if (post.text) {
            const text = document.createElement("div");
            text.className = "post-text";
            text.textContent = post.text;
            content.appendChild(text);
        }

        /* IMAGES */

        if (Array.isArray(post.images) && post.images.length > 0) {
            const images = document.createElement("div");
            images.className = "post-images";

            if (post.images.length === 1) {
                images.classList.add("single");
            }

            post.images.forEach(imageURL => {
                const image = document.createElement("img");
                image.src = imageURL;
                image.alt = post.title || "Post image";
                image.loading = "lazy";
                images.appendChild(image);
            });

            content.appendChild(images);
        }

        /* BUTTONS - MAXIMUM 3 */

        if (Array.isArray(post.buttons) && post.buttons.length > 0) {
            const buttons = document.createElement("div");
            buttons.className = "post-buttons";

            post.buttons.slice(0, 3).forEach(buttonData => {
                if (!buttonData.label || !buttonData.url) return;

                const button = document.createElement("a");
                button.className = "post-button";
                button.textContent = buttonData.label;
                button.href = buttonData.url;
                button.target = "_blank";
                button.rel = "noopener noreferrer";

                buttons.appendChild(button);
            });

            if (buttons.children.length > 0) {
                content.appendChild(buttons);
            }
        }

        card.appendChild(content);
        postsList.appendChild(card);
    });
}

renderPosts();
</script>

</body>
</html>
