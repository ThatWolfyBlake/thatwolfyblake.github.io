<style>
:root {
  --bg: #160A05;
  --chocolate: #241006;
  --panel: #2B1408;
  --orange: #FF9B32;
  --gold: #FFB65B;
  --cream: #FFE5C5;
  --beige: #D9BDA5;
  --muted: #987B68;
  --border: #FF8C42;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  font-family: system-ui, "Segoe UI", sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, #54270f 0%, transparent 48%),
    radial-gradient(ellipse at 100% 45%, #351509 0%, transparent 40%),
    linear-gradient(145deg, var(--chocolate), var(--bg) 65%);
}

.page {
  width: min(100% - 32px, 760px);
  margin: auto;
  padding: 30px 0 55px;
}

/* HEADER */

header {
  text-align: center;
  margin-bottom: 30px;
}

.brand {
  display: inline-block;
  color: var(--orange);
  font-size: clamp(2rem, 7vw, 3.3rem);
  font-weight: 850;
  letter-spacing: -.045em;
  text-decoration: none;
  text-shadow: 0 0 22px #ff8c4238;
}

.brand:hover { color: var(--gold); }

.subtitle {
  color: var(--beige);
  margin-top: 8px;
}

/* PROFILE */

.profile {
  animation: appear .4s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.image-section {
  width: 100%;
  max-width: 430px;
  margin: 0 auto 25px;
}

.main-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 15px;
  overflow: hidden;
  border: 2px solid var(--border);
  background: radial-gradient(circle, #6c3518, #2b1408 75%);
  box-shadow: 0 0 25px #ff8c4225;
  display: grid;
  place-items: center;
  position: relative;
}

.main-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.image-placeholder {
  color: var(--gold);
  font-size: 5rem;
  font-weight: 850;
  text-shadow: 0 0 25px #ff9b3255;
}

.text-placeholder {
  padding: 20px;
  color: var(--beige);
  font-size: 1rem;
  font-weight: 750;
  text-align: center;
  text-shadow: none;
}

.image-buttons {
  display: flex;
  gap: 10px;
  margin-top: 13px;
}

.image-buttons button {
  flex: 1;
  padding: 11px 8px;
  border-radius: 10px;
  border: 1px solid #70401f;
  background: #2b1408;
  color: var(--beige);
  font: 750 .9rem system-ui;
  cursor: pointer;
  transition: .2s;
}

.image-buttons button:hover {
  border-color: var(--orange);
  color: var(--cream);
}

.image-buttons button.active {
  background: linear-gradient(135deg, var(--orange), var(--gold));
  border-color: var(--gold);
  color: #281006;
  box-shadow: 0 0 15px #ff9b3233;
}

.image-label {
  color: var(--muted);
  font-size: .8rem;
  text-align: center;
  margin-top: 9px;
}

/* INFORMATION */

.info-panel {
  padding: 22px;
  border: 1px solid #87431f;
  border-radius: 15px;
  background: linear-gradient(160deg, #3b1d0d99, #241006d9);
  box-shadow: 0 8px 24px #00000020;
}

.toon-name {
  margin: 0;
  color: var(--orange);
  font-size: clamp(2rem, 7vw, 2.7rem);
  font-weight: 850;
  letter-spacing: -.035em;
  text-shadow: 0 0 15px #ff9b3224;
}

.toon-quote {
  color: var(--gold);
  font-style: italic;
  margin: 9px 0 0;
  font-size: .95rem;
  line-height: 1.7;
}

/* MULTIPLE RARITY / CLASS LABELS */

.rarity-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.rarity {
  display: inline-block;
  padding: 6px 13px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: #ff9b3215;
  color: var(--gold);
  font-size: .85rem;
  font-weight: 800;
}

.divider {
  height: 1px;
  margin: 23px 0;
  background: linear-gradient(90deg, #9b542a, #482312 75%, transparent);
}

.section-title {
  color: var(--orange);
  font-size: 1.15rem;
  font-weight: 850;
  margin: 0 0 10px;
}

.description {
  color: var(--beige);
  line-height: 1.7;
  white-space: pre-line;
  margin: 0;
}

.description s { color: var(--muted); }

.trinket {
  color: var(--cream);
  font-size: 1.05rem;
  font-weight: 750;
}

/* HANDLER TRACE BUTTONS */

.trace-section {
  margin-top: 23px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: linear-gradient(145deg, #49200d, #241006);
  box-shadow: 0 0 22px #ff9b3215;
}

.trace-section h2 {
  color: var(--gold);
  font-size: 1.1rem;
  margin: 0 0 13px;
}

.trace-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.trace-button {

  padding: 13px 15px;
  text-align: center;
  text-decoration: none;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: linear-gradient(135deg, var(--orange), var(--gold));
  color: #281006;
  font-weight: 850;
  transition: .2s;
}

.trace-button:hover {

/* PUFFIN EXCLUSIVE */

.special-card img {

/* BLUY EXCLUSIVE */

/* NOT FOUND */

/* FOOTER */

/* =====================================
   HELPERS
===================================== */

function slugify(name) {
  return name.toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

/*
  Text between # symbols becomes crossed out.
*/

function formatDescription(text) {
  const parts = String(text).split("#");

  return parts.map((part, index) => {
    const safeText = escapeHTML(part);

    return index % 2 === 1
      ? `<s>${safeText}</s>`
      : safeText;
  }).join("");
}

/* =====================================
   CHARACTER CLASS SYSTEM

   Custom classes take priority.
   Characters without custom classes
   receive their normal category.

   Maximum: THREE labels per character.
===================================== */

function getCharacterClasses(name) {

  if (characterClasses[name]) {
    return characterClasses[name].slice(0, 3);
  }

  for (const [rarity, characters] of Object.entries(categories)) {

    if (!characters.includes(name)) {
      continue;
    }

    const rarityLabels = {
      Primary: "Primary",
      Leads: "Lead",
      Mains: "Main",
      Rares: "Rare",
      Uncommons: "Uncommon",
      Commons: "Common",
      EX: "EX"
    };

    return [
      rarityLabels[rarity] || rarity
    ];
  }

  return [];
}

function renderClassLabels(classes) {

  return `
    <div class="rarity-list">
      ${classes.map(className => `
        <span class="rarity">
          ${escapeHTML(className)}
        </span>
      `).join("")}
    </div>
  `;
}

    ? `/lirons-museum/assets/drawings/d_${slug}.png`
    : `/lirons-museum/assets/${slug}.png`;

  regularButton.classList.toggle("active", type === "regular");
  drawingButton.classList.toggle("active", type === "drawing");

  label.textContent = type === "drawing"
    ? "Individual Design"
    : "Regular Toon Card";

  image.style.display = "block";
  placeholder.style.display = "none";

  image.onerror = function() {
    image.style.display = "none";
    placeholder.style.display = "block";
  };

  image.src = path;
}

/* =====================================
   HUMAN IMAGE SYSTEM
===================================== */

function loadHumanDrawing() {

  const slug = slugify(toonName);

  const image = document.getElementById("toonImage");
  const placeholder = document.getElementById("imagePlaceholder");

  image.onerror = function() {
    image.style.display = "none";
    placeholder.style.display = "block";
  };

  image.src = `/lirons-museum/assets/drawings/d_${slug}.png`;
}

/* =====================================
   HANDLER BUTTONS
===================================== */

function renderTraceButtons(handlerName) {

  const assignedToons = handlerToons[handlerName];

  if (!assignedToons || assignedToons.length === 0) {
    return "";
  }

  const buttons = assignedToons.map(toon => {

    const label = assignedToons.length > 1
      ? `Trace Toon: ${toon === "Liron FireBloom" ? "Liron" : toon}`
      : "Trace Toon";

    const url = `toon-card.html?=${encodeURIComponent(toon)}`;

    return `
      <a
        class="trace-button"
        href="${url}"
      >
        ${escapeHTML(label)}
      </a>
    `;

  }).join("");

  return `
    <section class="trace-section">

      <h2>Assigned Toons</h2>

      <div class="trace-buttons">
        ${buttons}
      </div>

    </section>
  `;
}

/* =====================================
   PROFILE RENDERING
===================================== */

function renderProfile() {

  if (!toonName) {
    showNotFound("No character was specified.");
    return;
  }

  const allCharacters = Object.values(categories).flat();

  // Investigator is deliberately outside regular categories.
  const isInvestigator = toonName === "Investigator";

  if (!allCharacters.includes(toonName) && !isInvestigator) {
    showNotFound("This character does not exist in the museum's collection.");
    return;
  }

  /*
    K, M, and J are not ready for profile pages yet.
  */

  const unavailableProfiles = ["K", "M", "J"];

  if (unavailableProfiles.includes(toonName)) {
    showNotFound("This toon does not have a profile yet.");
    return;
  }

  const data = toonData[toonName] || {};

  const isHuman = Object.prototype.hasOwnProperty.call(humanRoles, toonName);
  const humanRole = humanRoles[toonName];

  const isHandler = humanRole === "Handler";
  const isDrawingOnly = isHuman || isInvestigator;

  const displayName = data.displayName ||
    (data.surname ? `${toonName} ${data.surname}` : toonName);

  const classes = isInvestigator
    ? ["Researcher"]
    : isHuman
      ? [humanRole]
      : getCharacterClasses(toonName);

  const description = data.description || "Information coming soon.";
  const appearance = data.appearance || "Appearance information coming soon.";
  const trinket = data.trinket || "Not added yet.";

  const isPuffin = toonName === "Puffin";
  const isBluy = toonName === "Bluy";

  container.innerHTML = `

    <div class="profile">

      <section class="image-section">

        <div class="main-image">

          ${isInvestigator ? `

            <div class="image-placeholder text-placeholder">
              Image not provided
            </div>

          ` : `

            <img
              id="toonImage"
              alt="${escapeHTML(displayName)}"
            >

            <div
              class="image-placeholder"
              id="imagePlaceholder"
              style="display:none"
            >
              ?
            </div>

          `}

        </div>

        ${!isDrawingOnly ? `

          <div class="image-buttons">

            <button
              id="regularButton"
              class="active"
              onclick="changeImage('regular')"
            >
              Regular Image
            </button>

            <button
              id="drawingButton"
              onclick="changeImage('drawing')"
            >
              Drawing
            </button>

          </div>

          <div class="image-label" id="imageLabel">
            Regular Toon Card
          </div>

        ` : ""}

      </section>

      <section class="info-panel">

        <h1 class="toon-name">
          ${escapeHTML(displayName)}
        </h1>

        ${data.quote ? `
          <p class="toon-quote">
            "${escapeHTML(data.quote)}"
          </p>
        ` : ""}

        ${renderClassLabels(classes)}

        <div class="divider"></div>

        <h2 class="section-title">
          Description
        </h2>

        <p class="description">${formatDescription(description)}</p>

        ${!isHandler ? `

          <div class="divider"></div>

          <h2 class="section-title">
            Appearance
          </h2>

          <p class="description">${escapeHTML(appearance)}</p>

          <div class="divider"></div>

          <h2 class="section-title">
            Trinket
          </h2>

          <p class="trinket">
            ${escapeHTML(trinket)}
          </p>

        ` : ""}

      </section>

      ${isHandler ? renderTraceButtons(toonName) : ""}

      ${isPuffin ? `

        <section class="special-card">

          <h2>Introduction Card</h2>

          <img
            src="/lirons-museum/assets/puffin-card.png"
            alt="Puffin's Introduction Card"
            onerror="this.style.display='none'"
          >

        </section>

      ` : ""}

      ${isBluy ? `

        <a
          class="toon-page-link"
          href="/lirons-museum/bluy.html"
        >
          Pain
        </a>

      ` : ""}

    </div>

  `;

  if (isHuman) {
    loadHumanDrawing();
  } else if (!isInvestigator) {
    changeImage("regular");
  }

}

/* =====================================
   NOT FOUND
===================================== */

function showNotFound(message) {

  container.innerHTML = `

    <section class="not-found">

      <h1>Character Not Found</h1>

      <p>${escapeHTML(message)}</p>

      <a
        class="toon-page-link"
        href="/lirons-museum/see-toons.html"
      >
        Return to See Toons
      </a>

    </section>

  `;

}

/* =====================================
   START
===================================== */

renderProfile();

</script>

</body>
</html>
