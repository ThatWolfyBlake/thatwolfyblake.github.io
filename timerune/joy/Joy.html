<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            background: #222;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px #000;
        }

        img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        audio {
            width: 300px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="Joy.png" alt="Joy">

        <h1>Joy's Theme(WIP)</h1>

        <audio controls>
            <source src="Joyful girl.ogg" type="audio/mpeg">
            Seu navegador não suporta áudio.
        </audio>

    </div>

</body>
</html>
