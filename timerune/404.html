<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>* wrong path, wolf here!</title>

<style>
body{
  margin:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* imagem central */
#wolf{
  width:220px;
  cursor:pointer;
  image-rendering: pixelated;
  transition: transform 0.2s;
}

#wolf:hover{
  transform: scale(1.05);
}
</style>
</head>

<body>

<img id="wolf" src="assets/wof.png" alt="wof">

<audio id="sound" src="Creature Feature.m4a"></audio>

<script>
const wolf = document.getElementById("wolf");
const sound = document.getElementById("sound");

wolf.addEventListener("click", () => {
  sound.currentTime = 0;
  sound.play();
});
</script>

</body>
</html>
