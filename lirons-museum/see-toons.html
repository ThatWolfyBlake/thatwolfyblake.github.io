<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>See Toons — Liron's Museum</title>

<style>
:root {
  --bg: #160A05;
  --chocolate: #241006;
  --panel: #2B1408;
  --orange: #FF9B32;
  --gold: #FFB65B;
  --cream: #FFE5C5;
  --beige: #D9BDA5;
  --muted: #987B68;
  --border: #FF8C42;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  font-family: system-ui, "Segoe UI", sans-serif;

  background:
    radial-gradient(ellipse at 50% 0%, #54270f 0%, transparent 48%),
    radial-gradient(ellipse at 100% 45%, #351509 0%, transparent 40%),
    linear-gradient(145deg, var(--chocolate), var(--bg) 65%);
}

.page {
  width: min(100% - 32px, 760px);
  margin: auto;
  padding: 30px 0 56px;
}

header {
  text-align: center;
  margin-bottom: 28px;
}

.brand {
  display: inline-block;
  color: var(--orange);
  font-size: clamp(2rem, 7vw, 3.3rem);
  font-weight: 850;
  letter-spacing: -.045em;
  text-decoration: none;
  text-shadow: 0 0 22px #ff8c4238;
}

.brand:hover {
  color: var(--gold);
}

.subtitle {
  color: var(--beige);
  margin: 8px 0 0;
  font-size: 1.05rem;
}

.nav-wrap {
  position: sticky;
  top: 0;
  z-index: 5;
  padding: 10px 0 14px;
  background: linear-gradient(#1d0c05f2, #1d0c05e8);
  backdrop-filter: blur(10px);
}

nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: nowrap;
  overflow-x: auto;
  padding: 3px 0 7px;
  scrollbar-width: thin;
  scrollbar-color: #7d3d18 transparent;
}

nav button {
  flex: 0 0 auto;
  border: 1px solid #70401f;
  background: #2b1408;
  color: var(--beige);
  padding: 10px 14px;
  border-radius: 12px;
  font: 750 .9rem system-ui;
  cursor: pointer;
  transition: .18s;
}

nav button:hover {
  border-color: var(--border);
  color: var(--cream);
  transform: translateY(-1px);
}

nav button.active {
  background: linear-gradient(135deg, var(--orange), var(--gold));
  border-color: var(--gold);
  color: #281006;
  box-shadow: 0 0 18px #ff9b3233;
}

.section-head {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 28px 0 18px;
}

.section-head h1 {
  margin: 0;
  color: var(--orange);
  font-size: 1.9rem;
  font-weight: 850;
  letter-spacing: -.03em;
  text-shadow: 0 0 15px #ff9b3224;
}

.section-head .line {
  height: 1px;
  flex: 1;
  background: linear-gradient(
    90deg,
    #9b542a,
    #482312 75%,
    transparent
  );
}

.description {
  color: var(--beige);
  margin: -6px 0 22px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.toon-card {
  display: block;
  min-width: 0;
  text-align: center;
  padding: 12px;
  border: 1px solid #87431f;
  border-radius: 15px;
  background: linear-gradient(160deg, #3b1d0d99, #241006d9);
  box-shadow: 0 8px 24px #00000020;
  transition: transform .2s, border-color .2s;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}

.toon-card:hover {
  transform: translateY(-4px);
  border-color: var(--orange);
  box-shadow: 0 8px 28px #ff9b3220;
}

.toon-card:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

.portrait {
  aspect-ratio: 1 / 1;
  width: 100%;
  border-radius: 11px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: radial-gradient(
    circle at 50% 35%,
    #6c3518,
    #2b1408 70%
  );
  border: 1px solid #a85a2b55;
  position: relative;
}

.portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.portrait .placeholder {
  font-size: clamp(2rem, 8vw, 4rem);
  font-weight: 850;
  color: var(--gold);
  text-shadow: 0 0 20px #ff9b3255;
}

.portrait:after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    transparent 65%,
    #160a0540
  );
}

.toon-name {
  margin: 11px 0 1px;
  font-weight: 800;
  color: var(--cream);
  font-size: 1rem;
  overflow-wrap: anywhere;
}

.class-list {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 9px;
}

.class-badge {
  display: inline-block;
  padding: 4px 8px;
  border: 1px solid #a85a2b;
  border-radius: 7px;
  background: #3b1d0d;
  color: var(--gold);
  font-size: .68rem;
  font-weight: 800;
  letter-spacing: .025em;
}

.class-badge.hallow {
  border-color: #a85b35;
  background: #54220f;
  color: #ffad72;
}

.class-badge.egghunter {
  border-color: #8d8142;
  background: #3d3819;
  color: #f1d878;
}

.class-badge.gifter {
  border-color: #477c64;
  background: #193d2d;
  color: #a4e7bd;
}

.human-role {
  margin-top: 5px;
  color: var(--gold);
  font-size: .78rem;
  font-weight: 750;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.subsection-title {
  color: var(--gold);
  font-size: 1.25rem;
  font-weight: 850;
  margin: 28px 0 14px;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 44px 20px;
  border: 1px dashed #87502d;
  border-radius: 15px;
  background: #2b140866;
  color: var(--beige);
}

.empty strong {
  display: block;
  color: var(--gold);
  font-size: 1.25rem;
  margin-bottom: 7px;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
  margin-top: 42px;
}

@media(max-width:520px) {
  .page {
    width: min(100% - 22px, 760px);
    padding-top: 22px;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
  }

  .toon-card {
    padding: 9px;
  }

  nav {
    justify-content: flex-start;
  }

  nav button {
    padding: 9px 12px;
    font-size: .82rem;
  }

  .section-head h1 {
    font-size: 1.65rem;
  }
}

@media(min-width:680px) {
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<div class="page">

  <header>
    <a class="brand" href="/lirons-museum/">
      Liron's Museum
    </a>

    <p class="subtitle">
      A little collection of extraordinary toons.
    </p>
  </header>

  <div class="nav-wrap">
    <nav id="categoryNav" aria-label="Museum categories">

      <button class="active" data-category="Primary">Primary</button>
      <button data-category="Leads">Leads</button>
      <button data-category="Mains">Mains</button>
      <button data-category="Rares">Rares</button>
      <button data-category="Uncommons">Uncommons</button>
      <button data-category="Commons">Commons</button>
      <button data-category="EX">EX</button>
      <button data-category="Humans">Humans</button>

    </nav>
  </div>

  <main>

    <div class="section-head">
      <h1 id="categoryTitle">Primary</h1>
      <span class="line"></span>
    </div>

    <p class="description" id="categoryDescription"></p>

    <section class="grid" id="toonGrid" aria-live="polite">
    </section>

  </main>

  <footer>
    © Liron's Museum · Every toon has a story.
  </footer>

</div>

<script>

const categories = {

  Primary: [
    "Liron FireBloom"
  ],

  Leads: [
    "Don",
    "Countess Lockie",
    "Nixxy",
    "K",
    "M",
    "J"
  ],

  Mains: [
    "Bluy",
    "Hazel",
    "Solaris",
    "N3x0r",
    "Rose",
    "Shiro",
    "Candy SugarTooth",
    "Choccy Vanilloa",
    "Fiona Starling"
  ],

  Rares: [
    "Jesse",
    "Vexel",
    "Chris",
    "Dylan",
    "Lunaris",
    "Mike",
    "Maris",
    "Sarah",
    "Milly",
    "Creamy",
    "Randy",
    "Leon",
    "Balley",
    "Ashy",
    "Harley",
    "Basley",
    "Cappy"
  ],

  Uncommons: [
    "Lily",
    "Willy",
    "Lurian",
    "Matt",
    "Sleeper",
    "Garret",
    "Luki",
    "Violet-Lizzy",
    "Cardog",
    "Marshy",
    "Billy",
    "Carrol Bluefield",
    "Frostey"
  ],

  Commons: [
    "Puffin",
    "Spike",
    "Straps",
    "Gummy",
    "Batly",
    "Eggsley",
    "Henry"
  ],

  EX: [],

  Humans: {
    Founders: [
      "Kevin",
      "Mary",
      "John"
    ],

    Handlers: [
      "Noah",
      "Stella",
      "Alan",
      "Eliza",
      "Charlie",
      "Aubrey"
    ]
  }

};

/*
  Each toon can have up to three classes.
  Holiday toons receive their regular rarity AND their holiday class.
*/

const characterClasses = {

  "Batly": ["Common", "Hallow"],
  "Billy": ["Uncommon", "Hallow"],
  "Harley": ["Rare", "Hallow"],
  "Candy SugarTooth": ["Main", "Hallow"],

  "Eggsley": ["Common", "EggHunter"],
  "Carrol Bluefield": ["Uncommon", "EggHunter"],
  "Basley": ["Rare", "EggHunter"],
  "Choccy Vanilloa": ["Main", "EggHunter"],

  "Henry": ["Common", "Gifter"],
  "Frostey": ["Uncommon", "Gifter"],
  "Cappy": ["Rare", "Gifter"],
  "Fiona Starling": ["Main", "Gifter"]

};

const descriptions = {

  Primary: "Meet the museum's one-of-a-kind toon.",
  Leads: "The faces guiding the museum's story.",
  Mains: "The main cast of Liron's Museum.",
  Rares: "Meet the museum's rare toons.",
  Uncommons: "Discover the uncommon members of the collection.",
  Commons: "Meet the museum's common toons.",
  EX: "Extraordinary exhibits. Coming soon.",
  Humans: "Meet the humans who founded and help run the museum."

};

const grid = document.getElementById("toonGrid");
const title = document.getElementById("categoryTitle");
const description = document.getElementById("categoryDescription");
const nav = document.getElementById("categoryNav");

function slugify(name) {
  return name.toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function getCharacterClasses(name, category) {

  if (characterClasses[name]) {
    return characterClasses[name].slice(0, 3);
  }

  const rarityLabels = {
    Primary: "Primary",
    Leads: "Lead",
    Mains: "Main",
    Rares: "Rare",
    Uncommons: "Uncommon",
    Commons: "Common",
    EX: "EX"
  };

  return [rarityLabels[category] || category].slice(0, 3);
}

function createCard(name, category, role = "") {

  const card = document.createElement("a");
  card.className = "toon-card";

  const slug = slugify(name);

  card.href =
    "/lirons-museum/toon-card.html?="
    + encodeURIComponent(name);

  card.setAttribute("aria-label", "View " + name);

  const classes = role
    ? []
    : getCharacterClasses(name, category);

  const classHTML = classes.map(className => {

    const classSlug = className.toLowerCase();

    return `
      <span class="class-badge ${classSlug}">
        ${className}
      </span>
    `;

  }).join("");

  card.innerHTML = `
    <div class="portrait">

      <img
        src="/lirons-museum/assets/${slug}.png"
        alt="${name}"
        loading="lazy"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='grid';
        "
      >

      <span
        class="placeholder"
        style="display:none"
        aria-hidden="true"
      >${name.charAt(0)}</span>

    </div>

    <div class="toon-name">${name}</div>

    ${role
      ? `<div class="human-role">${role}</div>`
      : `<div class="class-list">${classHTML}</div>`
    }
  `;

  return card;
}

function render(category) {

  title.textContent = category;
  description.textContent = descriptions[category];

  grid.innerHTML = "";

  if (category === "Humans") {

    const humans = categories.Humans;

    const foundersTitle = document.createElement("h2");
    foundersTitle.className = "subsection-title";
    foundersTitle.textContent = "Founders";
    grid.appendChild(foundersTitle);

    humans.Founders.forEach(name => {
      grid.appendChild(createCard(name, category, "Founder"));
    });

    const handlersTitle = document.createElement("h2");
    handlersTitle.className = "subsection-title";
    handlersTitle.style.gridColumn = "1 / -1";
    handlersTitle.textContent = "Handlers";
    grid.appendChild(handlersTitle);

    humans.Handlers.forEach(name => {
      grid.appendChild(createCard(name, category, "Handler"));
    });

    return;
  }

  const toons = categories[category];

  if (!toons.length) {

    grid.innerHTML = `
      <div class="empty">
        <strong>Exhibits coming soon...</strong>
        This section is still being prepared for visitors.
      </div>
    `;

    return;
  }

  toons.forEach(name => {
    grid.appendChild(createCard(name, category));
  });

}

nav.addEventListener("click", event => {

  const button = event.target.closest("button[data-category]");

  if (!button) return;

  nav.querySelectorAll("button").forEach(item => {
    item.classList.toggle("active", item === button);
  });

  render(button.dataset.category);

});

render("Primary");

</script>

</body>
</html>
