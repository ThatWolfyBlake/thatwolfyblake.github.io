or:rgba(255,255,255,.76)}@media(max-width:680px){.shell{width:min(100% - 28px,1120px)}header{height:70px}.header-label{font-size:.6rem;letter-spacing:.12em}main{padding:34px 0 48px}.intro{border-radius:23px}.video-grid{grid-template-columns:1fr;gap:15px}.section-heading{align-items:start;flex-direction:column;gap:7px;margin-top:32px}.nav-buttons{flex-direction:column}.nav-button{width:100%}footer{align-items:flex-start;justify-content:center;flex-direction:column;padding:18px 2px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

<body><div class="shell"><header><a class="brand" href="index.html" aria-label="PRO home"><span class="brand-mark">P</span><span>PRO</span></a><span class="header-label">The video corner</span></header>
<main><section class="intro"><p class="eyebrow">Watch · Explore · Enjoy</p><h1>Videos</h1><p>A collection of videos from PRO.</p></section>
<div class="section-heading"><h2>Featured videos</h2><p id="video-count" aria-live="polite">0 videos</p></div><section id="video-grid" class="video-grid" aria-label="Video collection"></section><div id="empty-state" class="empty-state"><strong>No videos yet.</strong>Check back later for new uploads.</div>

<script>
// Fill any of these 10 slots. A slot only appears when its URL is a valid YouTube link.
// Supported formats: youtube.com/watch?v=..., youtu.be/..., youtube.com/shorts/...
const videoSlots=[
 {url:"",title:"",description:""}, // Slot 1
 {url:"",title:"",description:""}, // Slot 2
 {url:"",title:"",description:""}, // Slot 3
 {url:"",title:"",description:""}, // Slot 4
 {url:"",title:"",description:""}, // Slot 5
 {url:"",title:"",description:""}, // Slot 6
 {url:"",title:"",description:""}, // Slot 7
 {url:"",title:"",description:""}, // Slot 8
 {url:"",title:"",description:""}, // Slot 9
 {url:"",title:"",description:""}  // Slot 10
];
function getYouTubeId(url){try{const p=new URL(url),host=p.hostname.replace(/^www\./,"").toLowerCase();if(host==="youtu.be")return p.pathname.split("/").filter(Boolean)[0]||"";if(host.endsWith("youtube.com")){if(p.pathname==="/watch")return p.searchParams.get("v")||"";const a=p.pathname.split("/").filter(Boolean);if(["shorts","embed","live"].includes(a[0]))return a[1]||""}}catch(e){}return ""}
const grid=document.getElementById("video-grid"),items=videoSlots.map((v,i)=>({...v,index:i,id:getYouTubeId(v.url.trim())})).filter(v=>v.id);
document.getElementById("video-count").textContent=`${items.length} ${items.length===1?"video":"videos"}`;document.getElementById("empty-state").style.display=items.length?"none":"block";
items.forEach(v=>{const card=document.createElement("article");card.className="video-card";const player=document.createElement("div");player.className="player";const frame=document.createElement("iframe");frame.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}`;frame.title=v.title.trim()||`Video ${v.index+1}`;frame.loading="lazy";frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";frame.allowFullscreen=true;player.appendChild(frame);const info=document.createElement("div");info.className="video-info";const num=document.createElement("p");num.className="video-number";num.textContent=`Video slot ${v.index+1}`;const title=document.createElement("h3");title.className="video-title";title.textContent=v.title.trim()||`Video ${v.index+1}`;info.append(num,title);if(v.description.trim()){const desc=document.createElement("p");desc.className="video-description";desc.textContent=v.description.trim();info.appendChild(desc)}card.append(player,info);grid.appendChild(card)});
</script></body></html>
