
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Toon Profile — Liron's Museum</title>

<style>
:root {
  --bg: #160A05;
  --chocolate: #241006;
  --panel: #2B1408;
  --orange: #FF9B32;
  --gold: #FFB65B;
  --cream: #FFE5C5;
  --beige: #D9BDA5;
  --muted: #987B68;
  --border: #FF8C42;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  font-family: system-ui, "Segoe UI", sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, #54270f 0%, transparent 48%),
    radial-gradient(ellipse at 100% 45%, #351509 0%, transparent 40%),
    linear-gradient(145deg, var(--chocolate), var(--bg) 65%);
}

.page {
  width: min(100% - 32px, 760px);
  margin: auto;
  padding: 30px 0 55px;
}

/* HEADER */

header {
  text-align: center;
  margin-bottom: 30px;
}

.brand {
  display: inline-block;
  color: var(--orange);
  font-size: clamp(2rem, 7vw, 3.3rem);
  font-weight: 850;
  letter-spacing: -.045em;
  text-decoration: none;
  text-shadow: 0 0 22px #ff8c4238;
}

.brand:hover { color: var(--gold); }

.subtitle {
  color: var(--beige);
  margin-top: 8px;
}

/* PROFILE */

.profile {
  animation: appear .4s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.image-section {
  width: 100%;
  max-width: 430px;
  margin: 0 auto 25px;
}

.main-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 15px;
  overflow: hidden;
  border: 2px solid var(--border);
  background: radial-gradient(circle, #6c3518, #2b1408 75%);
  box-shadow: 0 0 25px #ff8c4225;
  display: grid;
  place-items: center;
  position: relative;
}

.main-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.image-placeholder {
  color: var(--gold);
  font-size: 5rem;
  font-weight: 850;
  text-shadow: 0 0 25px #ff9b3255;
}

.image-buttons {
  display: flex;
  gap: 10px;
  margin-top: 13px;
}

.image-buttons button {
  flex: 1;
  padding: 11px 8px;
  border-radius: 10px;
  border: 1px solid #70401f;
  background: #2b1408;
  color: var(--beige);
  font: 750 .9rem system-ui;
  cursor: pointer;
  transition: .2s;
}

.image-buttons button:hover {
  border-color: var(--orange);
  color: var(--cream);
}

.image-buttons button.active {
  background: linear-gradient(135deg, var(--orange), var(--gold));
  border-color: var(--gold);
  color: #281006;
  box-shadow: 0 0 15px #ff9b3233;
}

.image-label {
  color: var(--muted);
  font-size: .8rem;
  text-align: center;
  margin-top: 9px;
}

/* INFORMATION */

.info-panel {
  padding: 22px;
  border: 1px solid #87431f;
  border-radius: 15px;
  background: linear-gradient(160deg, #3b1d0d99, #241006d9);
  box-shadow: 0 8px 24px #00000020;
}

.toon-name {
  margin: 0;
  color: var(--orange);
  font-size: clamp(2rem, 7vw, 2.7rem);
  font-weight: 850;
  letter-spacing: -.035em;
  text-shadow: 0 0 15px #ff9b3224;
}

.toon-quote {
  color: var(--gold);
  font-style: italic;
  margin: 9px 0 0;
  font-size: .95rem;
  line-height: 1.7;
}

.rarity {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 13px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: #ff9b3215;
  color: var(--gold);
  font-size: .85rem;
  font-weight: 800;
}

.divider {
  height: 1px;
  margin: 23px 0;
  background: linear-gradient(90deg, #9b542a, #482312 75%, transparent);
}

.section-title {
  color: var(--orange);
  font-size: 1.15rem;
  font-weight: 850;
  margin: 0 0 10px;
}

.description {
  color: var(--beige);
  line-height: 1.7;
  white-space: pre-line;
  margin: 0;
}

.description s { color: var(--muted); }

.trinket {
  color: var(--cream);
  font-size: 1.05rem;
  font-weight: 750;
}

/* PUFFIN EXCLUSIVE */

.special-card {
  margin-top: 23px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: linear-gradient(145deg, #49200d, #241006);
  box-shadow: 0 0 22px #ff9b3215;
}

.special-card h2 {
  color: var(--gold);
  font-size: 1.1rem;
  margin: 0 0 13px;
}

.special-card img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 10px;
  border: 1px solid #ff8c4266;
}

/* BLUY EXCLUSIVE */

.toon-page-link {
  display: block;
  margin-top: 23px;
  padding: 14px;
  text-align: center;
  text-decoration: none;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: linear-gradient(135deg, var(--orange), var(--gold));
  color: #281006;
  font-weight: 850;
  transition: .2s;
}

.toon-page-link:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 20px #ff9b3244;
}

/* NOT FOUND */

.not-found {
  text-align: center;
  padding: 55px 20px;
  border: 1px dashed #87502d;
  border-radius: 15px;
  background: #2b140866;
}

.not-found h1 { color: var(--orange); }

/* FOOTER */

footer {
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
  margin-top: 40px;
}

/* MOBILE */

@media(max-width:520px) {
  .page {
    width: min(100% - 22px, 760px);
    padding-top: 22px;
  }

  .info-panel { padding: 17px; }
  .image-section { max-width: 100%; }
}
</style>
</head>

<body>

<div class="page">

<header>
  <a class="brand" href="/lirons-museum/">
    Liron's Museum
  </a>

  <p class="subtitle">
    Discover the museum's extraordinary toons.
  </p>
</header>

<main id="profileContainer"></main>

<footer>
  © Liron's Museum · Every toon has a story.
</footer>

</div>

<script>

/* =====================================
   TOON DATABASE
===================================== */

const categories = {

  Primary: [
    "Liron FireBloom"
  ],

  Leads: [
    "Don",
    "Countess Lockie",
    "Nixxy",
    "K",
    "M",
    "J"
  ],

  Mains: [
    "Bluy",
    "Hazel",
    "Solaris",
    "N3x0r",
    "Rose",
    "Shiro"
  ],

  Rares: [
    "Jesse",
    "Vexel",
    "Chris",
    "Dylan",
    "Lunaris",
    "Mike",
    "Maris",
    "Sarah",
    "Milly",
    "Creamy",
    "Randy",
    "Leon",
    "Balley",
    "Ashy"
  ],

  Uncommons: [
    "Lily",
    "Willy",
    "Lurian",
    "Matt",
    "Sleeper",
    "Garret",
    "Luki",
    "Violet-Lizzy",
    "Cardog",
    "Marshy"
  ],

  Commons: [
    "Puffin",
    "Spike",
    "Straps",
    "Gummy"
  ],

  EX: []

};

/* =====================================
   CUSTOM TOON INFORMATION
===================================== */

const toonData = {

  /* PRIMARY */

  "Liron FireBloom": {
    displayName: "Liron FireBloom",

    description:
      "#The lovely mascot of the museum, he is kind, and always looks out for his friends and the visitors, he is star of the show, always getting into adventures with his friends! Help him expand his world!#\n\nLiar, everything he does is to hurt the other toons, he doesn't deserve to be the star, he isn't like the Liron of the show, hes done too much damage to his own life. Its all his fault.",

    appearance:
      "Liron is an orange flower toon.",

    trinket: "Liron Plush"
  },

  /* LEADS */

  "Don": {
    displayName: "Donovan",

    description:
      "Donovan is the one who's always here for the other toons.\n\nThough he was kept a secret just like other Leads, hidden from the visitors, not a character in the show.\n\nBut he is here to help whatever toon needs it. He likes pirates.",

    appearance:
      "You can see, you know.",

    trinket: "TreasureMap"
  },

  "Countess Lockie": {
    displayName: "Countess Lockie",

    description:
      "The countess, she runs the train system, she enjoys having activities, such like fancy meals with toons whom she trusts.\n\nAs a lead, she was also hidden from the public, not a character in the show, not seen by visitors.",

    appearance:
      "Look.",

    trinket: "MasterKey"
  },

  "Nixxy": {
    displayName: "Nixxy Timely",

    description:
      "Nixxy makes sure the elevators are working, he has a strange way of talking, always putting time related words in his speech...\n\nAs a Lead, he was too, hidden from the public eye, not seen by visitors, not a character in the show.",

    appearance:
      "If you can read, you can see.",

    trinket: "StopWatch",

    quote:
      "I remember the past, memories of a long lost time, the children's laughter, even if i couldn't be part of the reason they were laughing, always made my time happier."
  },

  /* MAINS */

  "Bluy": {
    displayName: "Blyenn Bluefield",

    description:
      "#Liron's Best friend!# ... Bluy is a gentle toon! He owns the Garden Café, the perfect place to stop at while on a morning tour of the museum. Enjoy the fresh goods and the plants! He is Puffin's bestest of friends!",

    appearance:
      "Blueberry toon, wears his Lucky Charm, Black sweater.",

    trinket: "Luck Charm"
  },

  "Solaris": {
    displayName: "Solaris Novartis",

    description:
      "Solaris is the brightest of toons! Quite literally, since he is the sun! This fella loves the Wild West and stars. He said they could be as bright as he is! Stop at Solaris's Wild West Experience and help him catch those villains!",

    appearance:
      "He is the Sun as a toon, wearing his sheriff jacket with a black shirt beneath it. He has four arms.",

    trinket: "Sheriff's Hat"
  },

  "Hazel": {
    displayName: "Hazel Icedcream",

    description:
      "Hazel loves making sweets! She is a wonderful caretaker. Stop at Hazel's Pastry Shop and take a bite of a sweet treat! She looks after all children and other toons. Lily Foldery is her best friend!",

    appearance:
      "She is a strawberry ice cream toon. She wears a sweater that resembles an ice cream cone's texture.",

    trinket: "Ice Cream Scooper"
  },

  "N3x0r": {
    displayName: "N3x0r / V1rus",

    quote: "31th3r n4m3 w0rks",

    description:
      "N3x0r... or V1rus is the ringmaster of the museum's Game Shows! Step up and walk onto the stage. If all questions are correct, you win a prize!\n\nFeeling down? Walk to N3x0r's arcade and spend your extra time winning tickets and buying exclusive merch with them!",

    appearance:
      "Black cloud as a head, top hat, always in his suit, star stickers in his suit!",

    trinket: "Lost Code"
  },

  "Rose": {
    displayName: "Rose Sanghwaje",

    description:
      "Rose is like a mother. She has a caring heart. Got lost? Call Rose, and she will help you find your parent as quickly as she can!\n\nJoin her in her sector and learn about how nature really works!",

    appearance:
      "Just like her name, Rose is a rose. She wears a flowery dress.",

    trinket: "Watering Can"
  },

  "Shiro": {
    displayName: "Shiro the Shard!",

    description:
      "#Shiro is Liron's pet shard!# He resembles a cat, always up for some fun! Energetic, and most of all, he loves to play with children!\n\nJoin him in his play area and play until you get tired!",

    appearance:
      "Shiro is a big shard. He has cat ears and a cat tail.",

    trinket: "Prized Possession"
  },

  /* OTHER EXISTING PROFILES */

  "Puffin": {
    surname: "",
    description: "Description coming soon.",
    trinket: "Not added yet."
  }

};

/* =====================================
   GET TOON FROM URL
===================================== */

const params = new URLSearchParams(window.location.search);
const toonName = params.get("");

const container = document.getElementById("profileContainer");

/* =====================================
   HELPERS
===================================== */

function slugify(name) {
  return name.toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

/*
  Text between # symbols becomes crossed out.
*/

function formatDescription(text) {
  const parts = String(text).split("#");

  return parts.map((part, index) => {
    const safeText = escapeHTML(part);

    return index % 2 === 1
      ? `<s>${safeText}</s>`
      : safeText;
  }).join("");
}

function getRarity(name) {

  for (const [rarity, toons] of Object.entries(categories)) {
    if (toons.includes(name)) {
      return rarity;
    }
  }

  return "Unknown";
}

/* =====================================
   IMAGE SYSTEM
===================================== */

let currentImage = "regular";

function changeImage(type) {

  currentImage = type;

  const slug = slugify(toonName);

  const image = document.getElementById("toonImage");
  const placeholder = document.getElementById("imagePlaceholder");

  const regularButton = document.getElementById("regularButton");
  const drawingButton = document.getElementById("drawingButton");
  const label = document.getElementById("imageLabel");

  const path = type === "drawing"
    ? `/lirons-museum/assets/drawings/d_${slug}.png`
    : `/lirons-museum/assets/${slug}.png`;

  regularButton.classList.toggle("active", type === "regular");
  drawingButton.classList.toggle("active", type === "drawing");

  label.textContent = type === "drawing"
    ? "Individual Design"
    : "Regular Toon Card";

  image.style.display = "block";
  placeholder.style.display = "none";

  image.onerror = function() {
    image.style.display = "none";
    placeholder.style.display = "block";
  };

  image.src = path;
}

/* =====================================
   PROFILE RENDERING
===================================== */

function renderProfile() {

  if (!toonName) {
    showNotFound("No toon was specified.");
    return;
  }

  const allToons = Object.values(categories).flat();

  if (!allToons.includes(toonName)) {
    showNotFound("This toon does not exist in the museum's collection.");
    return;
  }

  const data = toonData[toonName] || {};

  const displayName = data.displayName ||
    (data.surname ? `${toonName} ${data.surname}` : toonName);

  const rarity = getRarity(toonName);

  const description = data.description || "Description coming soon.";
  const appearance = data.appearance || "Appearance information coming soon.";
  const trinket = data.trinket || "Not added yet.";

  const isPuffin = toonName === "Puffin";
  const isBluy = toonName === "Bluy";

  container.innerHTML = `

    <div class="profile">

      <section class="image-section">

        <div class="main-image">

          <img
            id="toonImage"
            alt="${escapeHTML(displayName)}"
          >

          <div
            class="image-placeholder"
            id="imagePlaceholder"
            style="display:none"
          >
            ?
          </div>

        </div>

        <div class="image-buttons">

          <button
            id="regularButton"
            class="active"
            onclick="changeImage('regular')"
          >
            Regular Image
          </button>

          <button
            id="drawingButton"
            onclick="changeImage('drawing')"
          >
            Drawing
          </button>

        </div>

        <div class="image-label" id="imageLabel">
          Regular Toon Card
        </div>

      </section>

      <section class="info-panel">

        <h1 class="toon-name">
          ${escapeHTML(displayName)}
        </h1>

        ${data.quote ? `
          <p class="toon-quote">
            "${escapeHTML(data.quote)}"
          </p>
        ` : ""}

        <span class="rarity">
          ${escapeHTML(rarity)}
        </span>

        <div class="divider"></div>

        <h2 class="section-title">
          Description
        </h2>

        <p class="description">${formatDescription(description)}</p>

        <div class="divider"></div>

        <h2 class="section-title">
          Appearance
        </h2>

        <p class="description">${escapeHTML(appearance)}</p>

        <div class="divider"></div>

        <h2 class="section-title">
          Trinket
        </h2>

        <p class="trinket">
          ${escapeHTML(trinket)}
        </p>

      </section>

      ${isPuffin ? `

        <section class="special-card">

          <h2>Introduction Card</h2>

          <img
            src="/lirons-museum/assets/puffin-card.png"
            alt="Puffin's Introduction Card"
            onerror="this.style.display='none'"
          >

        </section>

      ` : ""}

      ${isBluy ? `

        <a
          class="toon-page-link"
          href="/lirons-museum/bluy.html"
        >
          Visit Bluy's Toon Page →
        </a>

      ` : ""}

    </div>

  `;

  changeImage("regular");

}

/* =====================================
   NOT FOUND
===================================== */

function showNotFound(message) {

  container.innerHTML = `

    <section class="not-found">

      <h1>Toon Not Found</h1>

      <p>${escapeHTML(message)}</p>

      <a
        class="toon-page-link"
        href="/lirons-museum/see-toons.html"
      >
        Return to See Toons
      </a>

    </section>

  `;

}

/* =====================================
   START
===================================== */

renderProfile();

</script>

</body>
</html>
